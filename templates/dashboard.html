
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo Trading Terminal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        
        /* Layout Sections */
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .top-row { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 768px) { .top-row { grid-template-columns: 2fr 1fr; } }
        
        /* Components */
        .alert-box { background: linear-gradient(135deg, #6366f1, #4f46e5); padding: 20px; border-radius: 12px; display: none; text-align: center; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); height: fit-content; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Manual Trade Window Styling */
        .manual-trade-box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; height: fit-content; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 14px; color: #94a3b8; font-weight: 500; }
        .form-control { background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #6366f1; }
        .trade-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        
        /* Buttons & Badges */
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s ease; text-align: center; }
        .btn:hover { opacity: 0.9; }
        .btn-green { background: #22c55e; color: white; }
        .btn-white { background: white; color: #0f172a; }
        .btn-red { background: #ef4444; color: white; width: 100%; margin-top: 10px; }
        
        .status { font-weight: bold; display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .bullish { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .bearish { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Section: Alerts & Manual Trade Row -->
        <div class="top-row">
            <!-- लाइव अलर्ट सेक्शन -->
            <div id="alertSection" class="alert-box">
                <h2 style="margin-top:0;">⚡ <span id="alertSignal">ALERT</span> DETECTED</h2>
                <p><b id="alertIndex">INDEX</b> में सेटअप एक्टिव हुआ है, प्राइस: <b id="alertPrice">₹0</b></p>
                <div style="display: flex; justify-content: center; gap: 10px;">
                    <button class="btn btn-green" onclick="sendAction('EXECUTE')">EXECUTE (ट्रेड लें)</button>
                    <button class="btn btn-white" onclick="sendAction('SKIP')">SKIP (छोड़ें)</button>
                </div>
            </div>

            <!-- manual trade window -->
            <div class="manual-trade-box">
                <h3 style="margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">📊 Manual Trade Window</h3>
                
                <div class="form-group">
                    <label for="tradeIndex">Select Index</label>
                    <select id="tradeIndex" class="form-control">
                        <option value="NIFTY">NIFTY</option>
                        <option value="BANKNIFTY">BANKNIFTY</option>
                        <option value="FINNIFTY">FINNIFTY</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="strikePrice">Strike Price / Price</label>
                    <input type="number" id="strikePrice" class="form-control" placeholder="e.g. 24000" min="0">
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity (Lots)</label>
                    <input type="number" id="quantity" class="form-control" placeholder="e.g. 25" min="1">
                </div>

                <div class="trade-btn-group">
                    <button class="btn btn-green" onclick="sendManualTrade('BUY')">BUY (CE)</button>
                    <button class="btn btn-red" style="margin-top:0;" onclick="sendManualTrade('SELL')">SELL (PE)</button>
                </div>
            </div>
        </div>

        <!-- मुख्य बोर्ड ग्रिड -->
        <div class="grid" id="dashboardGrid"></div>
    </div>

    <script>
        function updateDashboard() {
            fetch('/api/data')
                .then(res => {
                    if (!res.ok) throw new Error('Network response error');
                    return res.json();
                })
                .then(data => {
                    // 1. Live Alert Section Control
                    const alertBox = document.getElementById('alertSection');
                    if (data.alert && data.alert.has_alert) {
                        document.getElementById('alertSignal').innerText = data.alert.signal_type || 'ALERT';
                        document.getElementById('alertIndex').innerText = data.alert.index_name || 'INDEX';
                        document.getElementById('alertPrice').innerText = '₹' + (data.alert.ltp ? data.alert.ltp.toFixed(2) : '0');
                        alertBox.style.display = 'block';
                    } else {
                        alertBox.style.display = 'none';
                    }

                    // 2. Grid Update Logic
                    let gridHtml = '';
                    if (data.indices) {
                        for (const [name, config] of Object.entries(data.indices)) {
                            let trendClass = config.st_dir === 1 ? 'bullish' : 'bearish';
                            let trendText = config.st_dir === 1 ? '🟢 BULL' : '🔴 BEAR';
                            let pnlColor = config.pnl >= 0 ? '#22c55e' : '#ef4444';
                            
                            gridHtml += `
                                <div class="card">
                                    <div>
                                        <div style="display:flex; justify-content:space-between; align-items:center;">
                                            <h3 style="margin:0;">${name}</h3>
                                            <span class="status ${trendClass}">${trendText}</span>
                                        </div>
                                        <h1 style="margin:10px 0; font-size:32px;">₹${config.ltp ? config.ltp.toFixed(2) : '0.00'}</h1>
                                        <p style="margin:0; color:#94a3b8; font-size:14px;">RSI: ${config.rsi || 'N/A'} | PCR: ${config.pcr || 'N/A'}</p>
                                    </div>
                                    
                                    ${config.in_position ? `
                                        <div style="margin-top:15px; background:#0f172a; padding:12px; border-radius:8px; border:1px solid #ef4444;">
                                            <p style="margin:0; font-size:14px; color:#ef4444;"><b>सक्रिय पोजीशन (${config.trade_type || ''})</b></p>
                                            <h2 style="margin:5px 0; color: ${pnlColor}">P&L: ₹${config.pnl ? config.pnl.toFixed(2) : '0.00'}</h2>
                                            <p style="margin:0; font-size:12px; color:#94a3b8;">SL: ₹${config.sl_price || '0'} | Target: ₹${config.target_price || '0'}</p>
                                            <button class="btn btn-red" onclick="sendAction('FORCE_EXIT', '${name}')">🛑 FORCE EXIT (पोजीशन काटें)</button>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }
                    }
                    document.getElementById('dashboardGrid').innerHTML = gridHtml;
                })
                .catch(err => console.error("Error fetching dashboard data:", err));
        }

        function sendAction(actionName, indexName = '') {
            fetch('/api/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: actionName, index: indexName })
            })
            .then(res => {
                if (res.ok) updateDashboard();
            })
            .catch(err => console.error("Error sending action:", err));
        }

        // Manual Trade API Trigger Function
        function sendManualTrade(actionType) {
            const index = document.getElementById('tradeIndex').value;
            const strike = document.getElementById('strikePrice').value;
            const qty = document.getElementById('quantity').value;

            if(!strike || !qty) {
                alert("कृपया Strike Price और Quantity दोनों भरें!");
                return;
            }

            fetch('/api/manual-trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: actionType, // BUY ya SELL
                    index: index,
                    strike_price: parseFloat(strike),
                    quantity: parseInt(qty)
                })
            })
            .then(res => {
                if (res.ok) {
                    alert(`Manual ${actionType} Order Sent for ${index}!`);
                    <!-- फाइल में सबसे नीचे इसे पेस्ट कर दें -->
<div class="market-header" style="background: #1e1e1e; color: #fff; padding: 15px; text-align: center; font-family: Arial, sans-serif; border-bottom: 2px solid #333; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;">
    <div class="live-time" style="font-size: 18px; margin-bottom: 8px;">
        🕒 लाइव समय: <span id="current-time" style="font-weight: bold; color: #00ff88;">00:00:00 AM</span>
    </div>
    <div class="index-status" style="font-size: 16px; word-spacing: 5px;">
        <span>NIFTY 50: <strong id="nifty-spot" style="color: #ff3333;">₹0.00</strong></span> | 
        <span>BANKNIFTY: <strong id="banknifty-spot" style="color: #00ff88;">₹0.00</strong></span>
    </div>
</div>

<script>
function updateClock() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    document.getElementById('current-time').textContent = timeString;
}
setInterval(updateClock, 1000);
updateClock();
</script>
